<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>정모:정글모임</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='output.css') }}"
    />
  </head>

  <body class="h-screen overflow-hidden bg-zinc-100 font-sans text-zinc-700">
    <main class="flex h-screen min-h-0">
      <!-- 왼쪽 메뉴 -->
      <aside class="flex h-full w-60 shrink-0 flex-col bg-zinc-200">
        <!-- <div class="bg-zinc-400 px-7 py-4 text-xl font-bold text-white">
        302 반
      </div> -->

        <div class="px-5 py-7">
          <p class="mb-2 text-sm text-zinc-500">{{ name }} 님 환영합니다</p>

          <a
            href="/post"
            class="block rounded bg-green-600 py-2 text-center text-sm font-semibold text-white"
          >
            + 글쓰기
          </a>

          <nav class="mt-6 space-y-4 text-sm font-medium">
            <a href="#" class="block">전체 게시글</a>
            <a href="/joinMeet" class="block text-zinc-400">참여한 게시글</a>
          </nav>
        </div>

        <div class="mt-auto p-5">
          <button
            class="w-full rounded bg-white py-2 text-sm font-semibold"
            onclick="logout()"
          >
            로그아웃
          </button>
        </div>
      </aside>

      <!-- 오른쪽 콘텐츠 -->
      <section class="min-h-0 min-w-0 flex-1 overflow-y-auto p-8">
        <div class="mb-4 flex justify-end">
          <div class="relative">
            <select
              id="sort-select"
              class="cursor-pointer appearance-none rounded-sm px-3 pr-6 text-sm font-bold bg-white"
            >
              <option value="latest">최신순</option>
              <option value="participants">참여자 많은 순</option>
            </select>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="pointer-events-none absolute right-0 top-1/2 size-4 -translate-y-1/2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m19.5 8.25-7.5 7.5-7.5-7.5"
              />
            </svg>
          </div>
        </div>

        <div id="cards-box" class="space-y-3"></div>
      </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      let orderType = "latest";

      $(document).ready(function () {
        $("#cards-box").html("");
        showMeets();
      });

      $("#sort-select").on("change", function () {
        orderType = $(this).val();
        $("#cards-box").empty();
        showMeets();
      });

      function showMeets() {
        console.log("showMeets 실행");

        $.ajax({
          type: "GET",
          url: "/meets",
          data: { orderType: orderType },
          success: function (response) {
            console.log("서버 응답:", response);

            let meets = response["meets"];

            console.log("게시글 개수:", meets.length);

            for (let i = 0; i < meets.length; i++) {
              console.log("for문 실행:", i);
              console.log("현재 게시글:", meets[i]);

              makeCard(
                meets[i]["_id"],
                meets[i]["title"],
                meets[i]["content"],
                meets[i]["people"],
                meets[i]["peopleCapacity"],
                meets[i]["month"],
                meets[i]["day"],
                meets[i]["time"],
                meets[i]["closeWhenFull"],
                meets[i]["createdAt"],
                meets[i]["author"],
              );
            }
          },
        });
      }

      function makeCard(
        id,
        title,
        content,
        people,
        peopleCapacity,
        month,
        day,
        time,
        closeWhenFull,
        createdAt,
        author,
      ) {
        console.log("makeCard 실행:", title);

        let temp = `
          <article class="flex items-center gap-4 rounded-lg bg-white p-4">

            <div class="min-w-0 flex-1">

              <span class="rounded bg-green-600 px-2 py-1 text-xs text-white">
                ${people}인/${peopleCapacity}인
              </span>

              <h2 class="mt-2 text-lg font-bold">
                ${title}
              </h2>

              <p class="truncate text-sm text-zinc-500">
                ${content}
              </p>

              <p class="mt-5 text-xs text-zinc-400">
                작성자 ${author} · ${month}월 ${day}일 ${time}
              </p>

            </div>

            <a
              href="/meetDetail?meet_id=${id}"
              class="flex shrink-0 items-center rounded-full bg-white px-5 py-2 text-medium font-bold text-green-600"
            >
              자세히보기

              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2.5"
                stroke="currentColor"
                class="size-4"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"
                />
              </svg>

            </a>

          </article>
        `;

        console.log("HTML 생성 완료");

        $("#cards-box").append(temp);
      }

      function logout() {
        $.ajax({
          type: "POST",
          url: "/api/logout",

          success: function (response) {
            if (response["result"] == "success") {
              alert("로그아웃 되었습니다.");
              window.location.href = "/login";
            }
          },
          error: function (xhr) {
            console.log(xhr.status);
            console.log(xhr.responseText);
          },
        });
      }
    </script>
  </body>
</html>
